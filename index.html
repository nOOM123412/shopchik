
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SubShop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0b0c0e;
    --card:#141619;
    --card-2:#1a1d21;
    --line:#26292e;
    --text:#f2f3f5;
    --muted:#8a8f98;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 600px at 10% -10%, #23272e 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, #1b2129 0%, transparent 55%),
      linear-gradient(180deg,#0b0c0e 0%,#0e1013 100%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
    min-height:100vh;
    padding:20px 16px 40px;
  }
  .wrap{max-width:520px;margin:0 auto}
  header{padding:8px 4px 20px}
  header h1{
    font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0 0 6px;
    background:linear-gradient(90deg,#ffffff,#aab3bf);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  header p{color:var(--muted);font-size:13px;margin:0}
  .filters{display:flex;gap:8px;overflow-x:auto;padding:4px 0 18px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1px solid var(--line);
    background:var(--card);color:var(--muted);font-size:13px;cursor:pointer;
    transition:.25s ease;
  }
  .chip.active{
    color:#0b0c0e;border-color:transparent;
    background:linear-gradient(135deg,#e9edf2,#a7b0bd);
  }
  .grid{display:grid;grid-template-columns:1fr;gap:12px}
  .card{
    position:relative;border-radius:18px;padding:18px;
    background:linear-gradient(160deg,var(--card-2),var(--card));
    border:1px solid var(--line);
    overflow:hidden;
    transition:transform .18s ease, border-color .25s ease;
  }
  .card::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(400px 200px at 100% 0%, rgba(180,200,230,.08), transparent 60%);
  }
  .card:active{transform:scale(.985)}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .svc{font-size:15px;font-weight:600;letter-spacing:-.01em}
  .plan{font-size:12.5px;color:var(--muted);margin-top:4px}
  .price{font-size:16px;font-weight:600;white-space:nowrap;
    background:linear-gradient(90deg,#ffffff,#b9c2cf);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .btn{
    margin-top:14px;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);
    background:linear-gradient(135deg,#2a2f36,#1b1e23);color:var(--text);
    font-size:14px;font-weight:500;cursor:pointer;transition:.2s ease;
  }
  .btn:active{background:linear-gradient(135deg,#3a4048,#24282e)}
  .badge{
    display:inline-block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);border:1px solid var(--line);border-radius:999px;
    padding:3px 9px;margin-bottom:10px;
  }
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);
    background:#1d2126;border:1px solid var(--line);color:var(--text);
    padding:12px 18px;border-radius:14px;font-size:13px;
    opacity:0;pointer-events:none;transition:.3s ease;z-index:10;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .skeleton{height:110px;border-radius:18px;background:linear-gradient(90deg,#15171a,#1c2025,#15171a);
    background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>SubShop</h1>
    <p>Подписки на любимые сервисы · без лишнего</p>
  </header>

  <div class="filters" id="filters"></div>
  <div class="grid" id="grid">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();
tg?.setHeaderColor?.('#0b0c0e');
tg?.setBackgroundColor?.('#0b0c0e');

const API = "https://your-domain.com";
const FILTERS = [
  {id:'all', label:'Все'},
  {id:'music', label:'Музыка'},
  {id:'ai', label:'AI'},
  {id:'tg', label:'Telegram'},
];
let active = 'all';

const ITEMS = [
  {id:'sc_3',  service:'SoundCloud', plan:'SoundCloud Go+ · 3 мес.',  price:690,  tag:'music'},
  {id:'sc_12', service:'SoundCloud', plan:'SoundCloud Go+ · 12 мес.', price:2190, tag:'music'},
  {id:'sp_3',  service:'Spotify',    plan:'Premium Individual · 3 мес.',  price:590,  tag:'music'},
  {id:'sp_12', service:'Spotify',    plan:'Premium Individual · 12 мес.', price:1990, tag:'music'},
  {id:'cl_1',  service:'Claude',     plan:'Claude Pro · 1 мес.', price:1790, tag:'ai'},
  {id:'cl_3',  service:'Claude',     plan:'Claude Pro · 3 мес.', price:4990, tag:'ai'},
  {id:'gpt_1', service:'ChatGPT',    plan:'ChatGPT Plus · 1 мес.', price:1890, tag:'ai'},
  {id:'gpt_3', service:'ChatGPT',    plan:'ChatGPT Plus · 3 мес.', price:5190, tag:'ai'},
  {id:'tg_3',  service:'Telegram',   plan:'Telegram Premium · 3 мес.',  price:890,  tag:'tg'},
  {id:'tg_12', service:'Telegram',   plan:'Telegram Premium · 12 мес.', price:2790, tag:'tg'},
];

function money(n){ return n.toLocaleString('ru-RU') + ' ₽'; }

function renderFilters(){
  const el = document.getElementById('filters');
  el.innerHTML = FILTERS.map(f=>`
    <button class="chip ${f.id===active?'active':''}" data-f="${f.id}">${f.label}</button>
  `).join('');
  el.querySelectorAll('.chip').forEach(b=>{
    b.onclick = ()=>{ active = b.dataset.f; renderFilters(); render(); };
  });
}

function render(){
  const grid = document.getElementById('grid');
  const list = ITEMS.filter(i => active==='all' || i.tag===active);
  grid.innerHTML = list.map(i=>`
    <div class="card">
      <div class="badge">${i.service}</div>
      <div class="row">
        <div>
          <div class="svc">${i.service}</div>
          <div class="plan">${i.plan}</div>
        </div>
        <div class="price">${money(i.price)}</div>
      </div>
      <button class="btn" data-id="${i.id}">Оформить</button>
    </div>
  `).join('');
  grid.querySelectorAll('.btn').forEach(b=>{
    b.onclick = ()=> buy(b.dataset.id, b);
  });
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__tt); window.__tt = setTimeout(()=>t.classList.remove('show'), 2200);
}

async function buy(id, btn){
  const item = ITEMS.find(i=>i.id===id);
  if(!item) return;
  btn.disabled = true; const prev = btn.textContent; btn.textContent = 'Оформляем…';
  try{
    const r = await fetch(API + '/api/order', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ init_data: tg?.initData || '', item_id: id })
    });
    const data = await r.json();
    if(!r.ok) throw new Error(data.detail || 'error');
    tg?.showPopup?.({
      title:'Заказ создан',
      message:`${item.service} · ${item.plan}\nНомер: ${data.order_id}\n\nПерейдите к оплате.`,
      buttons:[{type:'ok'}]
    });
  }catch(e){
    tg?.showPopup?.({
      title:'Заказ создан',
      message:`${item.service} · ${item.plan}\n\nСумма: ${money(item.price)}\n\nДля оплаты свяжитесь с поддержкой.`,
      buttons:[{type:'ok'}]
    });
  }finally{
    btn.disabled = false; btn.textContent = prev;
  }
}

renderFilters();
render();
</script>
</body>
</html>
